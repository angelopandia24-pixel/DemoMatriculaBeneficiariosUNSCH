[project]
name = "MatriculaUNSCH"
version = "1.0.0"
description = "Prototipo académico de motor configurable de reglas de matrícula"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["PruebasTesteo"]
python_files = ["prueba*.py", "test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]